# Used only for SSH sessions marked by sshd SetEnv SSH_AUTO_RESUME=1.
set-option -g history-limit 200000
set-option -g status on

# Native terminal feel: mouse/trackpad support, low ESC latency for TUIs/editors,
# focus events, alternate-screen restore, TrueColor, and OSC 52 clipboard sync.
set-option -s escape-time 10
set-option -s set-clipboard on
set-window-option -g alternate-screen on
set-option -gq focus-events on
set-option -gq mouse on
set-option -gq mode-mouse on
set-option -gq mouse-select-pane on
set-option -gq mouse-resize-pane on
set-option -gq mouse-select-window on
set-option -ga terminal-overrides ",*256col*:Tc,xterm*:Tc,alacritty*:Tc,foot*:Tc,kitty*:Tc,wezterm*:Tc,ghostty*:Tc"
set-option -ga terminal-overrides ",*:Ms=\\E]52;%p1%s;%p2%s\\007"

# Pin the per-attach env refresh list. Covers tmux >=3.x defaults plus
# WAYLAND_DISPLAY so X11 (ssh -X) and Wayland-over-SSH (waypipe, wayvnc)
# both stay usable across reconnects in new panes/windows.
set-option -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY"

# Native-feeling mouse wheel / trackpad & Shift+PageUp/PageDown scrolling (tmux >= 2.4),
# followed by optional per-user overrides (~/.config/ssh-multisession-resume/tmux.conf):
#   1. Already in tmux copy/view mode (#{pane_in_mode}): scroll copy-mode buffer.
#   2. Mouse-aware TUIs (opencode, nvim, htop, btop, nano -m; #{mouse_any_flag}):
#      forward real mouse wheel events directly into the TUI's scrollable panes.
#   3. Alternate-screen apps without mouse tracking (default nano, less, man; #{alternate_on}):
#      emulate native terminal alternate-scroll by sending 3 Up/Down lines per wheel tick.
#   4. Normal shell & inline output (long cat, compiler logs, CLI output):
#      enter copy-mode -e to scroll the 200,000-line history buffer and auto-exit at bottom.
if-shell 'tmux -V | awk "{ sub(/^[^0-9]*/, \"\", \$2); sub(/[^0-9.].*$/, \"\", \$2); exit !(\$2 + 0 >= 2.4) }"' \
  'bind-key -n WheelUpPane if-shell -F "#{pane_in_mode}" "send-keys -M" "if-shell -F \"#{mouse_any_flag}\" \"send-keys -M\" \"if-shell -F \\\"#{alternate_on}\\\" \\\"send-keys -N 3 Up\\\" \\\"copy-mode -e ; send-keys -M\\\"\"" ; bind-key -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" "if-shell -F \"#{mouse_any_flag}\" \"send-keys -M\" \"if-shell -F \\\"#{alternate_on}\\\" \\\"send-keys -N 3 Down\\\" \\\"\\\"\"" ; bind-key -n S-PPage if-shell -F "#{pane_in_mode}" "send-keys -X page-up" "if-shell -F \"#{alternate_on}\" \"send-keys S-PPage\" \"copy-mode -eu\"" ; bind-key -T copy-mode S-PPage send-keys -X page-up ; bind-key -T copy-mode S-NPage send-keys -X page-down ; bind-key -T copy-mode-vi S-PPage send-keys -X page-up ; bind-key -T copy-mode-vi S-NPage send-keys -X page-down ; if-shell "[ -r \"$HOME/.config/ssh-multisession-resume/tmux.conf\" ]" "source-file \"$HOME/.config/ssh-multisession-resume/tmux.conf\""' \
  'if-shell "[ -r \"$HOME/.config/ssh-multisession-resume/tmux.conf\" ]" "source-file \"$HOME/.config/ssh-multisession-resume/tmux.conf\""'
